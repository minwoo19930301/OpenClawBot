name: OCI deployment setup
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [inspect, install]
permissions:
  contents: read
concurrency:
  group: oci-production
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/main' && vars.OCI_DEPLOY_REPOSITORY == github.repository && vars.OCI_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Connect using the temporary bootstrap credential
        env:
          SSH_KEY: ${{ secrets.OCI_BOOTSTRAP_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          OCI_DEPLOY_REPOSITORY: ${{ vars.OCI_DEPLOY_REPOSITORY }}
          OCI_DEPLOY_HOST: ${{ vars.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ vars.OCI_DEPLOY_USER }}
          OCI_PUBLIC_ORIGIN: ${{ vars.OCI_PUBLIC_ORIGIN }}
          OPERATION: ${{ inputs.operation }}
          DEPLOY_PUBLIC_KEY: ${{ vars.OCI_DEPLOY_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy/workflow_config.py
          test -n "$SSH_KEY"
          target="$OCI_DEPLOY_USER@$OCI_DEPLOY_HOST"
          umask 077
          key="$RUNNER_TEMP/oci-bootstrap-key"
          hosts="$RUNNER_TEMP/oci-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$hosts"
          args=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=20)
          if [ "$OPERATION" = inspect ]; then
            ssh "${args[@]}" "$target" 'sudo -n python3 -' < scripts/deploy/inspect.py
          elif [ "$OPERATION" = install ]; then
            test -n "$DEPLOY_PUBLIC_KEY"
            ssh "${args[@]}" "$target" 'mkdir -p .openclaw-bootstrap && chmod 700 .openclaw-bootstrap'
            scp "${args[@]}" scripts/deploy/release.py scripts/deploy/install.sh "$target:.openclaw-bootstrap/"
            printf '%s\n' "$DEPLOY_PUBLIC_KEY" | ssh "${args[@]}" "$target" 'sudo -n bash .openclaw-bootstrap/install.sh'
          else
            exit 2
          fi
