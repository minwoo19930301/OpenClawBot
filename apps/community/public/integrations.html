<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연결 서비스 · OpenClawBot</title><link rel="stylesheet" href="/integrations.css"></head><body><main><a href="/">← 대화로 돌아가기</a><h1>연결 서비스</h1><p><a id="personal-chat" href="/">개인 비서 대화 열기 →</a></p><p>관리자 개인 연결입니다. 왼쪽 개인 비서 대화에서 연결 서비스를 사용할 수 있습니다. 개인 비서의 대화 기록은 본인만 볼 수 있으며 초대할 수 없습니다.</p><p id="status" role="status">연결 목록을 불러오는 중…</p><section class="assistant"><h2>개인 서비스에 질문하기</h2><p>요청한 조회 결과를 연결된 AI 모델이 읽고 답합니다. 이 답변은 이 화면에서만 표시됩니다.</p><form id="ask-form"><input id="ask-prompt" aria-label="개인 서비스 질문" placeholder="최근 받은 메일을 요약해 줘" maxlength="2000" required><button id="ask-button">질문</button></form><pre id="answer" aria-live="polite"></pre></section><section id="services"></section><h2>모델 공급자</h2><p>자동순환은 실패한 키를 잠시 제외하고 다음 공급자를 시도합니다. 지정 모델은 같은 모델을 제공하는 키만 재시도합니다.</p><button id="models">모델 연결 확인</button><pre id="model-result"></pre></main><script type="module" src="/integrations.js"></script></body></html>
