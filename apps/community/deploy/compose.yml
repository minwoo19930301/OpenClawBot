name: community
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  app:
    build:
      context: ../../..
      dockerfile: apps/community/deploy/Dockerfile
      args:
        RELEASE: ${COMMUNITY_RELEASE:-development}
    image: community-app:local
    cgroup_parent: community.slice
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      COMMUNITY_MONITOR_PATH: /run/community-monitor/status.json
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - community-data:/data
      - /var/lib/community-monitor:/run/community-monitor:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks:
      desktop:
        ipv4_address: 172.30.50.2
      web:
        ipv4_address: 172.30.51.3
      ai:
        ipv4_address: 172.30.52.2
  openclaw:
    profiles: [openclaw]
    image: ghcr.io/openclaw/openclaw:2026.9.5
    command: [node, openclaw.mjs, gateway, --bind, lan, --port, '18890']
    cgroup_parent: community.slice
    restart: unless-stopped
    init: true
    env_file: .env.openclaw
    environment:
      OPENCLAW_CONFIG_PATH: /etc/openclaw/community.json
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - ./openclaw/community.json:/etc/openclaw/community.json:ro,Z
      - community-openclaw:/home/node/.openclaw
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/node/.cache:size=128m,uid=1000,gid=1000,mode=700
    mem_limit: 2g
    cpus: 0.75
    pids_limit: 192
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks:
      ai:
        ipv4_address: 172.30.52.3
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18890/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
  desktop-4bc4b8f0-1789-4afb-a927-e7adbcc7b9b9:
    build: ./desktop
    image: community-desktop:local
    cgroup_parent: community.slice
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:6080:6080'
      - '127.0.0.1:9222:9222'
    tmpfs:
      - /home/desktop:size=512m,uid=10001,gid=10001,mode=700
      - /tmp:size=128m,mode=1777
      - /run/desktop:size=32m,uid=10001,gid=10001,mode=700
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    shm_size: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./desktop/seccomp-chromium.json
    logging: *logging
    networks:
      desktop:
        ipv4_address: 172.30.50.3
  caddy:
    image: caddy:2.11.4-alpine
    cgroup_parent: community.slice
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks:
      web:
        ipv4_address: 172.30.51.2
    depends_on:
      app:
        condition: service_healthy
networks:
  ai:
    name: community-ai
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.52.0/28
  desktop:
    name: community-desktop
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.50.0/28
  web:
    name: community-web
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.51.0/28
volumes:
  community-openclaw:
  community-data:
  caddy-data:
  caddy-config:
